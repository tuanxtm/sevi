[package]
name = "sevi-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sevi-ui-protocol.workspace = true
sevi-runtime.workspace = true
sevi-engine.workspace = true
serde_json.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["x11", "wayland", "accesskit", "clipboard"] }
egui = { version = "=0.37.0", default-features = false }
unicode-segmentation = "1"
raw-window-handle = "0.6"
png = "0.18"

[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
wgpu = { version = "30", default-features = false, features = ["metal"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
pangocairo = "0.22"
gio = "0.22"
glib = "0.22"

[[bin]]
name = "sevi-ui-preview"
path = "src/bin/preview.rs"
