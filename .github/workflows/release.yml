name: Release Windows x64
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching Cargo.toml, for example v1.0.30'
        required: true
permissions:
  contents: read
concurrency:
  group: release-windows
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'tuanxtm/sevi'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-x64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-windows-x64-
            check-Windows-${{ hashFiles('Cargo.lock') }}
            check-Windows-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r Tools/github/requirements.txt
      - name: Validate release tag and tooling
        run: |
          python Tools/github/release.py check --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s Tools/github -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p sevi-windows --lib
      - run: cargo clippy --locked -p sevi-windows --all-targets -- -D warnings
      - run: cargo build --locked --release -p sevi-windows --bin sevi --target x86_64-pc-windows-msvc
      - name: Install pinned Inno Setup compiler
        run: |
          $download = Join-Path (Get-Location) 'target\tool-downloads\innosetup-7.1.1-x64.exe'
          New-Item -ItemType Directory -Force (Split-Path $download) | Out-Null
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLower() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Inno Setup checksum mismatch' }
          $directory = Join-Path (Get-Location) 'target\tools\inno'
          $process = Start-Process $download -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$directory`"" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Installer and portable package
        run: python Tools/github/release.py package --tag $env:RELEASE_TAG
      - name: Sign installer and generate update feed
        env:
          SEVI_UPDATE_PRIVATE_KEY: ${{ secrets.SEVI_UPDATE_PRIVATE_KEY }}
        run: python Tools/github/release.py sign --tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sevi-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/github/release.py publish --tag $env:RELEASE_TAG
